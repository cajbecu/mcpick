version: 2

# Named here rather than taken from the git remote, so a fork or a local
# clone builds the same archive names as the release.
project_name: mcpick

# No `go mod tidy` hook: it would edit the tree at release time, and CI
# already fails a pull request whose go.mod is not tidy.

builds:
  - env:
      - CGO_ENABLED=0
    # Reproducible: the same tag builds the same bytes, which is what makes
    # the provenance attestation worth checking.
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

# One macOS binary for both Intel and Apple Silicon. It replaces the two
# per-architecture darwin builds, so there is a single darwin archive.
universal_binaries:
  - replace: true

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - SECURITY.md
      - man/mcpick.1
      - completions/*
      - docs/*

# Linux packages, attached to the release next to the archives. They install
# the man page and shell completions where each distribution looks for them.
nfpms:
  - package_name: mcpick
    homepage: https://github.com/cajbecu/mcpick
    maintainer: Adrian Cristea <adrian@softarea.ro>
    description: Choose which MCP servers a coding-agent session loads, at launch time.
    license: MIT
    formats: [deb, rpm, apk]
    contents:
      - src: man/mcpick.1
        dst: /usr/share/man/man1/mcpick.1
      - src: completions/mcpick.bash
        dst: /usr/share/bash-completion/completions/mcpick
      - src: completions/_mcpick
        dst: /usr/share/zsh/site-functions/_mcpick
      - src: completions/mcpick.fish
        dst: /usr/share/fish/vendor_completions.d/mcpick.fish
      # Plain files, not `type: doc`: nfpm marks a doc file for the rpm
      # only and leaves it out of the deb and the apk.
      - src: LICENSE
        dst: /usr/share/doc/mcpick/LICENSE
      - src: README.md
        dst: /usr/share/doc/mcpick/README.md
      - src: SECURITY.md
        dst: /usr/share/doc/mcpick/SECURITY.md

# Homebrew. Casks are GoReleaser's current Homebrew format (formulas are
# deprecated there). The cask lives in a separate tap repository and is pushed
# with a token that can write to it; with an empty token the upload is
# skipped, so a release never fails for want of it. The variable itself must
# be set (see token below).
homebrew_casks:
  - name: mcpick
    homepage: https://github.com/cajbecu/mcpick
    description: Choose which MCP servers a coding-agent session loads, at launch time
    license: MIT
    binaries: [mcpick]
    manpages: [man/mcpick.1]
    completions:
      bash: completions/mcpick.bash
      zsh: completions/_mcpick
      fish: completions/mcpick.fish
    repository:
      owner: cajbecu
      name: homebrew-tap
      # The cask's token is templated with .Env only (envOrDefault and
      # isEnvSet are not defined there), so the variable must exist: the
      # release workflow always sets it, empty when the secret is missing,
      # and a local run needs HOMEBREW_TAP_TOKEN= in front.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ end }}'
    commit_msg_template: "mcpick {{ .Tag }}"
    # The binary is not signed with an Apple Developer ID, so Gatekeeper
    # would call it damaged. Removing the quarantine flag after install is the
    # usual answer for unsigned command-line tools; it trusts this tap, and
    # signing plus notarisation is the way to stop needing it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mcpick"]
          end

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge branch"

# Local and CI dry runs name their build after `git describe`, like every
# other non-release build: 0.2.0-dirty, 0.2.0-3-gabc1234. The default,
# 0.2.0-SNAPSHOT-<commit>, reads as if it were exactly that commit even when
# the tree has changed since.
snapshot:
  version_template: '{{ trimprefix .Summary "v" }}'

release:
  footer: |
    ## Install

    **Homebrew** (macOS and Linux)
    ```sh
    brew install cajbecu/tap/mcpick
    ```

    **Go**
    ```sh
    go install {{ .ModulePath }}@{{ .Tag }}
    ```

    **Debian / Ubuntu, Fedora / RHEL, Alpine** — download the package for your
    architecture from the assets below, then:
    ```sh
    sudo apt install ./mcpick_{{ .Version }}_linux_amd64.deb   # or: sudo dnf install ./…rpm · sudo apk add --allow-untrusted ./…apk
    ```

    **Nix**
    ```sh
    nix run github:cajbecu/mcpick/{{ .Tag }}
    ```

    **Anything else** — download the archive for your system below and put
    `mcpick` on your `PATH`. The macOS archive is one universal binary for Intel
    and Apple Silicon.

    Check a download against `checksums.txt`, or against its signed build
    provenance:
    ```sh
    gh attestation verify <file> -R cajbecu/mcpick
    ```
